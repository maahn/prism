<!DOCTYPE html>
<!-- Login page for `prism --password-file`; a Jinja template rendered by Panel
     (variables: login_endpoint, errormessage). Self-contained on purpose: it is
     served before anyone is logged in, and nothing is loaded from a CDN.
     The logo is a copy of logo.svg (a test checks they match). -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRISM | Login</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; line-height: 1.5; color: #1f2d3d; }
    .wrap { display: flex; align-items: center; justify-content: center; min-height: 100%; background: #f3f5f8; }
    form { width: 340px; max-width: calc(100% - 32px); padding: 1.6em 2em 2em; background: #fff;
           border: 1px solid #dde3ea; border-radius: 10px; box-shadow: 0 2px 10px #0000000d; }
    .logo { width: 230px; max-width: 100%; margin: 0 auto 0.4em; display: block; }
    .logo svg { width: 100%; height: auto; display: block; }
    p.lead { text-align: center; color: #5b6b7d; margin-bottom: 1.1em; }
    input[type=password] { width: 100%; padding: 12px; font-size: 1em; background: #fafbfc;
                           border: 1px solid #cfd8e3; border-radius: 6px; }
    input[type=password]:focus { outline: 2px solid #1f4e8c55; border-color: #1f4e8c; }
    button { width: 100%; margin-top: 1em; padding: 11px; font-size: 1em; letter-spacing: .08em;
             text-transform: uppercase; color: #fff; background: #1f4e8c; border: 0; border-radius: 6px; cursor: pointer; }
    button:hover { background: #173d70; }
    .error { min-height: 1.5em; margin-bottom: .5em; text-align: center; color: #c62828; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <form action=".{{ login_endpoint }}" method="post">
      <div class="logo">

<text x='120' y='176' text-anchor='middle' font-size='30' fill='#1f4e8c' font-family='Helvetica Neue, Arial, sans-serif' font-weight='700' letter-spacing='6'>PRISM</text>
</svg>
      </div>
      <p class="lead">Enter the password to continue</p>
      <div class="error">{% if errormessage %}Wrong password{% endif %}</div>
      <!-- A shared password has no user names; Panel only needs a non-empty one -->
      <input type="hidden" name="username" value="prism">
      <input type="password" name="password" placeholder="password" autocomplete="current-password" autofocus required>
      <button type="submit">Log in</button>
    </form>
  </div>
</body>
</html>
