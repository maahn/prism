[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-viewer"
version = "0.1.0"
description = "PRISM: interactive viewer for ground-based remote-sensing time-height products and raw Doppler spectra"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "numpy",
    "xarray",
    "netCDF4",
    "rpgpy",
    "zarr",
    "holoviews",
    # panel and bokeh are pinned together deliberately: panel bundles its own
    # BokehJS build, and an installed `bokeh` newer than what that panel
    # version bundles makes the browser and server speak mismatched protocol
    # versions -- click/tap/hover events silently stop reaching the server
    # with no visible error. Bump both together, deliberately, and
    # re-verify interactivity after.
    "panel==1.9.4",
    "bokeh==3.8.2",
]

[project.scripts]
prism = "prism.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
